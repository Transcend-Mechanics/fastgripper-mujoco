[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fastgripper-sim"
version = "0.4.0"
description = "FastGripper MuJoCo simulation, controls and learning examples"
readme = "README.md"
license = "LicenseRef-FastGripper-Distribution"
license-files = ["LICENSE", "LICENSE-CODE", "LICENSE-ASSETS", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.15"
dependencies = ["mujoco>=3.3,<4", "numpy>=2,<3", "pillow>=11,<13"]

[project.optional-dependencies]
learn = ["gymnasium>=1.2,<2", "stable-baselines3>=2.7,<3", "matplotlib>=3.10,<4"]
video = ["imageio[ffmpeg]>=2.37,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["fastgripper_sim"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "fastgripper_sim/assets"
"examples" = "fastgripper_sim/examples"

[tool.hatch.build.targets.sdist]
include = ["fastgripper_sim", "assets", "examples", "README.md", "LICENSE", "LICENSE-CODE", "LICENSE-ASSETS", "THIRD_PARTY_NOTICES.md", "learning.md", "arm.md", "ursim.md", "uv.lock", ".python-version", "Makefile", "docs", "tests", "scripts", "release-readiness.json", "CHANGELOG.md", "CONTRIBUTING.md", ".github", ".gitignore", "distribution.json"]
